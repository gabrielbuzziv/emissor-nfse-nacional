name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out and runs the tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # xmllint validates the documents against the official XSDs; xmlsec1 checks the signatures.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils xmlsec1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
